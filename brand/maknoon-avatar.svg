<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="مكنون">
  <defs>
    <radialGradient id="avBg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#12303C"/>
      <stop offset="0.55" stop-color="#0A141C"/>
      <stop offset="1" stop-color="#07090D"/>
    </radialGradient>
    <linearGradient id="avMark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#38CFFF"/>
      <stop offset="1" stop-color="#FF4081"/>
