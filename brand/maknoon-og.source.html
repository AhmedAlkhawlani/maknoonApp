<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'PlexAr';src:url('file:///Users/ahmdalkhwlany/IdeaProjects/maknoonApp/assets/fonts/plex-ar-700.woff2') format('woff2');font-weight:700;font-display:block}
  @font-face{font-family:'PlexAr';src:url('file:///Users/ahmdalkhwlany/IdeaProjects/maknoonApp/assets/fonts/plex-ar-500.woff2') format('woff2');font-weight:500;font-display:block}
  @font-face{font-family:'PlexAr';src:url('file:///Users/ahmdalkhwlany/IdeaProjects/maknoonApp/assets/fonts/plex-la-500.woff2') format('woff2');font-weight:500;unicode-range:U+0000-00FF;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#07090D;font-family:'PlexAr',sans-serif;color:#E8EEF5;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 84px;position:relative;
  }
  body::before{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(600px 420px at 82% 12%, rgba(0,229,255,.16), transparent 65%),
      radial-gradient(520px 380px at 12% 92%, rgba(255,64,129,.13), transparent 65%);
  }
  body::after{
    content:'';position:absolute;inset:0;opacity:.35;
    background-image:linear-gradient(rgba(0,229,255,.07) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(0,229,255,.07) 1px, transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 78%);
  }
  .mark{position:relative;width:250px;flex:none;filter:drop-shadow(0 0 34px rgba(0,229,255,.28))}
  .mark img{width:100%;display:block}
  .txt{position:relative;text-align:right;flex:1;padding-left:56px}
  .kicker{
    font-size:17px;letter-spacing:.24em;color:#00E5FF;opacity:.85;
    text-transform:uppercase;margin-bottom:22px;direction:ltr;text-align:right;
  }
  h1{font-size:92px;font-weight:700;line-height:1;letter-spacing:-1px;
     background:linear-gradient(100deg,#EAF7FF 20%,#7FE9FF 60%,#FF7BA5 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;}
  .tag{margin-top:26px;font-size:30px;font-weight:500;color:#9FB0C2;line-height:1.5}
  .rule{width:120px;height:3px;margin:30px 0 0;border-radius:2px;
        background:linear-gradient(90deg,#00E5FF,#FF4081)}
  .foot{position:absolute;bottom:44px;right:84px;left:84px;display:flex;justify-content:space-between;
        font-size:16px;color:#5C6B7C;direction:ltr}
  .dot{color:#00E5FF}
</style>
</head>
<body>
  <div class="txt">
    <div class="kicker">Maknoon // Software</div>
    <h1>مَكْنُون</h1>
    <div class="tag">برمجيات أصيلة · أمان محلي<br>استقلال رقمي تام</div>
    <div class="rule"></div>
  </div>
  <div class="mark"><img src="file:///Users/ahmdalkhwlany/IdeaProjects/maknoonApp/brand/maknoon-mark.svg" alt=""></div>
  <div class="foot"><span>ahmedalkhawlani.github.io/maknoonApp</span><span class="dot">●</span></div>
</body>
</html>
